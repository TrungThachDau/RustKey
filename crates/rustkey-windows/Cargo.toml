[package]
name = "rustkey"
description = "RustKey - Vietnamese input method for Windows (WinUI 3 via windows-reactor)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rustkey"
path = "src/main.rs"

[dependencies]
rustkey-engine = { path = "../rustkey-engine", features = ["serde"] }
windows-reactor = "0.100"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.9.1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
miniz_oxide = "0.9.1"
windows-reactor-setup = "0.100"

[lints]
workspace = true
